name: AI Auto Approve
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: contains(github.actor, 'bot') || contains(github.actor, 'copilot') || github.actor == 'dependabot[bot]'
    steps:
      - name: Approve PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review ${{ github.event.pull_request.number }} --approve -b "Auto-approved by AI governance."
