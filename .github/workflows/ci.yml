# ci.yml — production CI gate (Python/FastAPI services).
# Replaces AWS CodeBuild pr-validation.yml + security-scan.yml.
# Target: < 90s wall-clock via parallel jobs + shallow clone + uv cache.
# Deps updated: 2026-08-17.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.3"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/requirements-dev.lock"
      - name: Install ruff (pinned — skips full dev-dep install)
        run: uv pip install --system ruff==0.15.20
      - name: Ruff lint
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          cd "${BD:-.}" && ruff check .
      - name: Ruff format check
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          cd "${BD:-.}" && ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # NOTE: mypy is continue-on-error while repos resolve pre-existing type errors.
    # Remove continue-on-error once the repo's mypy baseline is clean.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/requirements-dev.lock"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            backend/.mypy_cache
            .mypy_cache
          key: mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements-dev.lock') }}
          restore-keys: mypy-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          BD="${BD:-.}"
          if [ -f "$BD/requirements-dev.lock" ]; then
            uv pip install --system --quiet -r "$BD/requirements-dev.lock"
            uv pip install --system --quiet --no-deps -e "$BD"
          else
            uv pip install --system --quiet mypy==2.3.0
            uv pip install --system --quiet -e "$BD" || true
          fi
      - name: Mypy
        continue-on-error: true
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          cd "${BD:-.}" && mypy --ignore-missing-imports . || echo "WARN: mypy errors present — not blocking (pre-existing)"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/requirements-dev.lock"
      - name: Install dependencies
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          BD="${BD:-.}"
          if [ -f "$BD/uv.lock" ]; then
            # uv sync: installs project + all dev deps into backend/.venv
            cd "$BD" && uv sync --dev --quiet
          elif [ -f "$BD/requirements-dev.lock" ]; then
            uv pip install --system --quiet -r "$BD/requirements-dev.lock"
            uv pip install --system --quiet --no-deps -e "$BD"
          else
            uv pip install --system --quiet pytest pytest-asyncio pytest-cov pytest-xdist aiosqlite httpx
            uv pip install --system --quiet -e "$BD" || true
          fi
          # Ensure both postgres drivers regardless of what the lock contains.
          # For uv.lock repos: inject into the venv directly.
          # For pip repos: inject system-wide.
          if [ -f "$BD/uv.lock" ]; then
            cd "$BD" && uv pip install --quiet asyncpg psycopg2-binary || true
          else
            uv pip install --system --quiet asyncpg psycopg2-binary || true
          fi
      - name: Lock drift gate
        # Non-blocking: lock drift is a developer workflow issue, not a migration blocker.
        continue-on-error: true
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/uv.lock" ] && echo "$d" && break; done)
          if [ -n "$BD" ]; then
            cd "$BD"
            uv lock --frozen || { echo "WARN: uv.lock out of date (non-blocking)" >&2; exit 0; }
            uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.lock
            uv export --frozen --extra dev --no-emit-project --no-hashes -o requirements-dev.lock
            if ! git diff --quiet -- requirements.lock requirements-dev.lock; then
              echo "WARN: requirements*.lock drift detected (non-blocking):" >&2
              git --no-pager diff -- requirements.lock requirements-dev.lock >&2
            fi
          fi
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/test_db
          AI_MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/test_db
          SYNC_DATABASE_URL: postgresql://postgres:ci@localhost:5432/test_db
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d/tests" ] && echo "$d" && break; done)
          BD="${BD:-.}"
          # Exclude CodeBuild governance tests — assert .codebuild/ exists (intentionally removed).
          IGNORE=""
          for f in test_ci_download_checksums test_repo_automation_guards test_buildspec; do
            [ -n "$(find "$BD" -name "${f}*.py" -path '*/tests/*' 2>/dev/null)" ] && \
              IGNORE="$IGNORE --ignore-glob=*${f}*"
          done
          cd "$BD"
          if [ -f "uv.lock" ]; then
            # uv run python -m pytest: uses the .venv created by uv sync above.
            # NOTE: 'uv run pytest' fails if pytest is not a declared script entry
            # point. 'python -m pytest' always works when pytest is in the venv.
            uv run python -m pytest -q --no-header --tb=line -n auto $IGNORE
          else
            python -m pytest -q --no-header --tb=line -n auto $IGNORE
          fi

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Gitleaks: continue-on-error if GITLEAKS_LICENSE secret is not set.
      # Blocking secret scan is enforced org-wide via the org-level Gitleaks configuration.
      - name: Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/requirements-dev.lock"
      - name: Bandit (high-severity)
        run: |
          uv pip install --system --quiet bandit
          TARGETS=()
          for d in backend core/backend src; do [ -d "$d" ] && TARGETS+=("$d"); done
          if [ ${#TARGETS[@]} -eq 0 ]; then echo "WARN: no python dirs; skipped"
          else bandit -r "${TARGETS[@]}" -lll -iii --exclude '**/tests/**,**/test_*.py,**/migrations/**'; fi
      - name: pip-audit (report-only)
        continue-on-error: true
        run: |
          uv pip install --system --quiet pip-audit
          for req in $(find . \( -name "requirements*.txt" -o -name "requirements*.lock" \) \
            -not -path "*/.venv/*" -not -path "*/node_modules/*"); do
            pip-audit -r "$req" || echo "WARN: pip-audit findings (report-only)"
          done
