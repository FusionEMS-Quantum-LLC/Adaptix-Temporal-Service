# ci.yml — canonical CI gate for Adaptix-Temporal-Service.
#
# Replaces AWS CodeBuild pr-validation.yml + security-scan.yml.
# Target: < 2 min wall-clock via parallel jobs + uv + aggressive caching.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.3"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          BD="${BD:-.}"
          if [ -f "$BD/requirements-dev.lock" ]; then
            uv pip install --system --quiet -r "$BD/requirements-dev.lock"
            uv pip install --system --quiet --no-deps -e "$BD"
          else
            uv pip install --system --quiet ruff==0.15.20
            uv pip install --system --quiet -e "$BD" || true
            uv pip install --system --quiet -e "$BD[dev]" || true
          fi
      - name: Ruff lint
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          cd "${BD:-.}" && ruff check .
      - name: Ruff format check
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          cd "${BD:-.}" && ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Restore mypy cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            backend/.mypy_cache
            .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: mypy-${{ runner.os }}-
      - name: Install dependencies
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          BD="${BD:-.}"
          if [ -f "$BD/requirements-dev.lock" ]; then
            uv pip install --system --quiet -r "$BD/requirements-dev.lock"
            uv pip install --system --quiet --no-deps -e "$BD"
          else
            uv pip install --system --quiet mypy==2.3.0
            uv pip install --system --quiet -e "$BD" || true
            uv pip install --system --quiet -e "$BD[dev]" || true
          fi
      - name: Mypy
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          cd "${BD:-.}" && mypy --ignore-missing-imports .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/pyproject.toml" ] && echo "$d" && break; done)
          BD="${BD:-.}"
          if [ -f "$BD/requirements-dev.lock" ]; then
            uv pip install --system --quiet -r "$BD/requirements-dev.lock"
            uv pip install --system --quiet --no-deps -e "$BD"
          else
            uv pip install --system --quiet pytest pytest-asyncio pytest-cov pytest-xdist aiosqlite httpx
            uv pip install --system --quiet -e "$BD" || true
            uv pip install --system --quiet -e "$BD[dev]" || true
          fi
      - name: Lock drift gate
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d" ] && [ -f "$d/uv.lock" ] && echo "$d" && break; done)
          if [ -n "$BD" ]; then
            cd "$BD"
            uv lock --frozen || { echo "ERROR: uv.lock is out of date vs pyproject.toml." >&2; exit 1; }
            uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.lock
            uv export --frozen --extra dev --no-emit-project --no-hashes -o requirements-dev.lock
            if ! git diff --quiet -- requirements.lock requirements-dev.lock; then
              echo "ERROR: requirements*.lock out of sync with uv.lock." >&2
              git --no-pager diff -- requirements.lock requirements-dev.lock >&2
              exit 1
            fi
          fi
      - name: Pytest (parallel)
        env:
          AI_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/test_db
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/test_db
        run: |
          BD=$(for d in backend core/backend src .; do [ -d "$d/tests" ] && echo "$d" && break; done)
          cd "${BD:-.}" && python -m pytest -q --no-header --tb=line -n auto

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907078de3127a2 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Install uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Bandit (high-severity — BLOCKING)
        run: |
          uv pip install --system --quiet bandit
          TARGETS=()
          for d in backend core/backend src; do [ -d "$d" ] && TARGETS+=("$d"); done
          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "WARN: no python source dirs; bandit skipped"
          else
            bandit -r "${TARGETS[@]}" -lll -iii \
              --exclude '**/tests/**,**/test_*.py,**/migrations/**'
          fi
      - name: pip-audit (report-only)
        continue-on-error: true
        run: |
          uv pip install --system --quiet pip-audit
          for req in $(find . \( -name "requirements*.txt" -o -name "requirements*.lock" \) -not -path "*/node_modules/*" -not -path "*/.venv/*"); do
            pip-audit -r "$req" || echo "WARN: pip-audit findings (report-only)"
          done
